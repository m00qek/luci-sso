<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
  <!-- Browser chrome -->
  <rect width="900" height="40" fill="#e8eaed"/>
  <rect x="10" y="10" width="20" height="20" rx="10" fill="#bdc1c6"/>
  <rect x="40" y="10" width="20" height="20" rx="10" fill="#bdc1c6"/>
  <rect x="70" y="10" width="20" height="20" rx="10" fill="#bdc1c6"/>
  <rect x="100" y="8" width="700" height="24" rx="12" fill="#fff" stroke="#dadce0"/>
  <text x="450" y="24" font-family="monospace" font-size="12" fill="#5f6368" text-anchor="middle">https://console.cloud.google.com/apis/credentials/oauthclient</text>
  <!-- Google header -->
  <rect y="40" width="900" height="52" fill="#fff" stroke="#dadce0" stroke-width="0.5"/>
  <text x="20" y="72" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a73e8">Google</text>
  <text x="80" y="72" font-family="sans-serif" font-size="16" fill="#5f6368"> Cloud Console</text>
  <text x="700" y="72" font-family="sans-serif" font-size="13" fill="#5f6368">My Project ▾</text>
  <!-- Sidebar -->
  <rect x="0" y="92" width="200" height="468" fill="#fff" stroke="#dadce0" stroke-width="0.5"/>
  <text x="16" y="120" font-family="sans-serif" font-size="12" fill="#5f6368">APIs &amp; Services</text>
  <text x="16" y="148" font-family="sans-serif" font-size="12" fill="#5f6368">  Dashboard</text>
  <text x="16" y="172" font-family="sans-serif" font-size="12" fill="#5f6368">  Library</text>
  <rect x="0" y="182" width="200" height="30" fill="#e8f0fe"/>
  <text x="16" y="202" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a73e8">  Credentials</text>
  <text x="16" y="228" font-family="sans-serif" font-size="12" fill="#5f6368">  OAuth consent screen</text>
  <!-- Main content -->
  <rect x="216" y="100" width="668" height="444" fill="white" stroke="#dadce0" stroke-width="0.5"/>
  <text x="236" y="132" font-family="sans-serif" font-size="16" font-weight="bold" fill="#202124">OAuth client created</text>
  <line x1="236" y1="142" x2="868" y2="142" stroke="#dadce0"/>
  <text x="236" y="168" font-family="sans-serif" font-size="12" fill="#5f6368">Your client ID and secret are shown below. Copy them before closing this dialog.</text>
  <!-- Result panel -->
  <rect x="236" y="184" width="628" height="160" rx="4" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="256" y="212" font-family="sans-serif" font-size="12" fill="#5f6368">Client ID</text>
  <rect x="256" y="220" width="588" height="32" rx="3" fill="white" stroke="#dadce0"/>
  <text x="268" y="241" font-family="monospace" font-size="11" fill="#202124">123456789012-abcdefghijklmnopqrstuvwxyz012345.apps.googleusercontent.com</text>
  <text x="256" y="276" font-family="sans-serif" font-size="12" fill="#5f6368">Client Secret</text>
  <rect x="256" y="284" width="588" height="32" rx="3" fill="white" stroke="#dadce0"/>
  <text x="268" y="305" font-family="monospace" font-size="11" fill="#202124">GOCSPX-AbCdEfGhIjKlMnOpQrStUvWxYz01234</text>
  <!-- Copy hint -->
  <text x="236" y="370" font-family="sans-serif" font-size="12" fill="#5f6368">Use these values in the luci-sso UCI configuration:</text>
  <text x="256" y="398" font-family="monospace" font-size="11" fill="#3c4043">client_id = &lt;the Client ID above&gt;</text>
  <text x="256" y="420" font-family="monospace" font-size="11" fill="#3c4043">client_secret = &lt;the Client Secret above&gt;</text>
  <!-- OK button -->
  <rect x="744" y="468" width="120" height="36" rx="4" fill="#1a73e8"/>
  <text x="804" y="491" font-family="sans-serif" font-size="14" fill="white" text-anchor="middle">OK</text>
  <!-- Placeholder banner -->
  <rect x="0" y="510" width="900" height="50" fill="#fef3cd"/>
  <text x="450" y="539" font-family="sans-serif" font-size="13" fill="#856404" text-anchor="middle">[ PLACEHOLDER — Replace with actual screenshot of Google Cloud Console showing OAuth client credentials ]</text>
</svg>
