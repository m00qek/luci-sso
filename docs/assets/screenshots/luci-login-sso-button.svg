<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <rect width="900" height="480" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>

  <!-- Browser chrome -->
  <rect width="900" height="40" fill="#e0e0e0"/>
  <rect x="10" y="10" width="20" height="20" rx="10" fill="#bbb"/>
  <rect x="40" y="10" width="20" height="20" rx="10" fill="#bbb"/>
  <rect x="70" y="10" width="20" height="20" rx="10" fill="#bbb"/>
  <rect x="100" y="8" width="700" height="24" rx="12" fill="#fff" stroke="#ccc"/>
  <text x="450" y="24" font-family="monospace" font-size="12" fill="#666" text-anchor="middle">https://192.168.1.1/cgi-bin/luci/</text>

  <!-- LuCI login page background -->
  <rect y="40" width="900" height="440" fill="#1a237e"/>

  <!-- Login card -->
  <rect x="300" y="100" width="300" height="300" rx="8" fill="white" filter="url(#shadow)"/>

  <!-- OpenWrt logo placeholder -->
  <rect x="370" y="120" width="160" height="40" rx="4" fill="#f5f5f5"/>
  <text x="450" y="146" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">OpenWrt</text>

  <!-- SSO button (primary) -->
  <rect x="320" y="180" width="260" height="44" rx="6" fill="#1a237e"/>
  <text x="450" y="208" font-family="sans-serif" font-size="14" fill="white" text-anchor="middle">Login with SSO</text>

  <!-- Divider -->
  <line x1="320" y1="244" x2="580" y2="244" stroke="#e0e0e0"/>
  <text x="450" y="240" font-family="sans-serif" font-size="11" fill="#bbb" text-anchor="middle" dx="0" dy="0">  or  </text>

  <!-- Password login section -->
  <text x="450" y="270" font-family="sans-serif" font-size="12" fill="#aaa" text-anchor="middle">Username</text>
  <rect x="320" y="278" width="260" height="32" rx="4" fill="#f9f9f9" stroke="#ddd"/>

  <text x="450" y="328" font-family="sans-serif" font-size="12" fill="#aaa" text-anchor="middle">Password</text>
  <rect x="320" y="336" width="260" height="32" rx="4" fill="#f9f9f9" stroke="#ddd"/>

  <!-- Placeholder banner -->
  <rect x="0" y="430" width="900" height="50" fill="rgba(0,0,0,0.5)"/>
  <text x="450" y="460" font-family="sans-serif" font-size="13" fill="#fff8e1" text-anchor="middle">[ PLACEHOLDER — Replace with actual screenshot of LuCI login page showing "Login with SSO" button ]</text>
</svg>
