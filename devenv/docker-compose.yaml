networks:
  lucisso-net:
    external: true
    name: luci-sso-net

services:
  openwrt:
    container_name: ${SDK_ARCH}-${SDK_VERSION}-openwrt
    image: ${DOCKER_NAMESPACE}/luci-sso-openwrt:${SDK_ARCH}-${SDK_VERSION}
    platform: ${DOCKER_PLATFORM}
    stop_grace_period: 0s
    build:
      context: ./services/openwrt
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
      args:
        DOCKER_PLATFORM: ${DOCKER_PLATFORM}
        SDK_ARCH: ${ROOTFS_ARCH}
        SDK_VERSION: ${SDK_VERSION}
        PKG_DEPENDS: "${PKG_DEPENDS}"
    networks:
      lucisso-net:
        aliases:
          - "${FQDN_LUCI}"
    environment:
      - SDK_VERSION=${SDK_VERSION}
      - DOMAIN=${DOMAIN}
      - FQDN_IDP=${FQDN_IDP}
      - FQDN_LUCI=${FQDN_LUCI}
      - CRYPTO_LIB=${CRYPTO_LIB}
      - SDK_ARCH=${SDK_ARCH}
    volumes:
      # Certificates
      - ./.pki/CA.crt:/etc/ssl/certs/CA.crt:ro
      - ./.pki/${FQDN_LUCI}.crt:/etc/uhttpd.crt:ro
      - ./.pki/${FQDN_LUCI}.key:/etc/uhttpd.key:ro

      # Unified Start Scripts
      - ./services/openwrt/start.sh:/usr/local/bin/start.sh:ro
      - ./services/openwrt/setup-uci.sh:/usr/local/bin/setup-uci.sh:ro
      - ./base-startup.sh:/usr/local/bin/base-startup.sh:ro

      # Project Code
      - ../files/usr/share/ucode/luci_sso:/usr/share/ucode/luci_sso:ro
      - ../files/www/cgi-bin/luci-sso:/www/cgi-bin/luci-sso:ro
      - ../files/www/luci-static/resources/luci-sso-login.js:/www/luci-static/resources/luci-sso-login.js:ro
      - ../files/www/luci-static/resources/view/services:/www/luci-static/resources/view/services:ro
      - ../files/usr/share/luci/menu.d/luci-app-sso.json:/usr/share/luci/menu.d/luci-app-sso.json:ro
      - ../files/usr/share/rpcd/acl.d/luci-app-sso.json:/usr/share/rpcd/acl.d/luci-app-sso.json:ro
      - ../files/etc/uci-defaults:/usr/share/luci-sso/uci-defaults:ro
      - ../files/usr/sbin/luci-sso-cleanup:/usr/sbin/luci-sso-cleanup:ro
      - ../bin/lib/${SDK_ARCH}/${SDK_VERSION}:/luci_sso/backends:ro
      - ../test:/usr/share/luci-sso/test:ro
    command: /bin/sh /usr/local/bin/start.sh --foreground
    healthcheck:
      test: ["CMD-SHELL", "uclient-fetch -qO- https://${FQDN_LUCI} > /dev/null"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s

  sdk:
    container_name: ${SDK_ARCH}-${SDK_VERSION}-sdk
    image: ${DOCKER_NAMESPACE}/luci-sso-sdk:${SDK_ARCH}-${SDK_VERSION}
    build:
      context: ./services/sdk
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
      args:
        SDK_ARCH: ${SDK_ARCH}
        SDK_VERSION: ${SDK_VERSION}
    volumes:
      - ..:/sdk/package/luci-sso
      - ../bin/lib:/artifacts
      - ./services/sdk/build.sh:/usr/local/bin/build.sh:ro
    working_dir: /sdk
    user: buildbot
    environment:
      - CRYPTO_LIB=${CRYPTO_LIB}
      - SDK_ARCH=${SDK_ARCH}
      - SDK_VERSION=${SDK_VERSION}

  fuzzer:
    container_name: ${SDK_ARCH}-${SDK_VERSION}-fuzzer
    build:
      context: ./services/fuzzer
    volumes:
      - ..:/work
    working_dir: /work
    environment:
      - CRYPTO_LIB=${CRYPTO_LIB}
    tty: true
    stdin_open: true
