# binfmt registration for 32-bit big-endian MIPS (OpenWrt musl variant)
#
# Standard qemu-mips binfmt entries require EI_ABIVERSION (ELF byte 8) = 0x00.
# OpenWrt's musl-based MIPS busybox sets EI_ABIVERSION = 0x01, so standard
# registrations don't match and exec fails with ENOEXEC.
#
# This entry masks byte 8 (0x00 in the mask = ignore), matching any MIPS32
# big-endian ELF regardless of EI_ABIVERSION.
#
# Install: sudo cp this file to /etc/binfmt.d/qemu-mips.conf
#          sudo systemctl restart systemd-binfmt
:qemu-mips:M::\x7fELF\x01\x02\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x08:\xff\xff\xff\xff\xff\xff\xff\x00\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff:/usr/bin/qemu-mips-static:F
