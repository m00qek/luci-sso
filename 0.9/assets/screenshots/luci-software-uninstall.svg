  <!-- Filter box -->
  <text x="600" y="151" font-family="sans-serif" font-size="12" fill="#666">Filter:</text>
  <rect x="640" y="130" width="220" height="32" rx="4" fill="#f9f9f9" stroke="#ccc"/>
  <text x="650" y="151" font-family="sans-serif" font-size="12" fill="#333">luci-sso</text>

  <!-- Table with luci-sso -->
  <rect x="40" y="180" width="820" height="240" fill="#fff" stroke="#eee"/>
  <line x1="40" y1="210" x2="860" y2="210" stroke="#ddd"/>
  
  <!-- Row 1 -->
  <text x="60" y="235" font-family="sans-serif" font-size="12" fill="#333">luci-sso</text>
  <rect x="780" y="220" width="60" height="24" rx="4" fill="#f44336"/>
  <text x="810" y="236" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle">Remove</text>

  <!-- Row 2 -->
  <line x1="40" y1="255" x2="860" y2="255" stroke="#eee"/>
  <text x="60" y="280" font-family="sans-serif" font-size="12" fill="#333">luci-sso-crypto-mbedtls</text>
  <rect x="780" y="265" width="60" height="24" rx="4" fill="#f44336"/>
  <text x="810" y="281" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle">Remove</text>

  <!-- Placeholder banner -->
  <rect x="0" y="430" width="900" height="50" fill="rgba(0,0,0,0.5)"/>
