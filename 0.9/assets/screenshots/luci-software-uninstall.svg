  <!-- LuCI header -->
  <rect y="40" width="900" height="50" fill="#1a237e"/>
  <text x="20" y="72" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">OpenWrt - Software</text>

  <!-- Content area -->
  <rect x="20" y="110" width="860" height="340" rx="4" fill="white" stroke="#ddd"/>
  
