name: Continuous Integration

on:
  push:
    branches: [main, master, ci]
  pull_request:
    branches: [main, master, ci]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild of all images"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  metadata:
    name: Extract Metadata
    runs-on: ubuntu-latest
    outputs:
      pkg_depends: ${{ steps.vars.outputs.pkg_depends }}
      sdk_version: ${{ steps.vars.outputs.sdk_version }}
      sdk_arch: ${{ steps.vars.outputs.sdk_arch }}
      node_version: ${{ steps.vars.outputs.node_version }}
      alpine_version: ${{ steps.vars.outputs.alpine_version }}
      repo_owner: ${{ steps.vars.outputs.repo_owner }}
      changed_fuzzer: ${{ steps.filter.outputs.fuzzer }}
      changed_openwrt: ${{ steps.filter.outputs.openwrt }}
      changed_sdk: ${{ steps.filter.outputs.sdk }}
      changed_idp: ${{ steps.filter.outputs.idp }}
      changed_browser: ${{ steps.filter.outputs.browser }}
      changed_pki: ${{ steps.filter.outputs.pki }}
      changed_makefile: ${{ steps.filter.outputs.makefile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get Project Variables
        id: vars
        run: |
          # Use --no-print-directory and xargs to ensure perfectly clean strings
          DEPENDS=$(make -s --no-print-directory -C devenv print-env VAR=PKG_DEPENDS | xargs)
          VERSION=$(make -s --no-print-directory -C devenv print-env VAR=SDK_VERSION | xargs)
          NODE_V=$(make -s --no-print-directory -C devenv print-env VAR=NODE_VERSION | xargs)
          ALPINE_V=$(make -s --no-print-directory -C devenv print-env VAR=ALPINE_VERSION | xargs)
          ARCH="x86-64"

          echo "pkg_depends=$DEPENDS" >> $GITHUB_OUTPUT
          echo "sdk_version=$VERSION" >> $GITHUB_OUTPUT
          echo "sdk_arch=$ARCH" >> $GITHUB_OUTPUT
          echo "node_version=$NODE_V" >> $GITHUB_OUTPUT
          echo "alpine_version=$ALPINE_V" >> $GITHUB_OUTPUT

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_owner=$OWNER" >> $GITHUB_OUTPUT

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fuzzer: 'devenv/services/fuzzer/**'
            openwrt: 'devenv/services/openwrt/**'
            sdk: 'devenv/services/sdk/**'
            idp: 'devenv/services/idp/**'
            browser: 'devenv/services/browser/**'
            pki: 'devenv/services/pki/**'
            makefile: 'devenv/Makefile'

  build-versioned:
    name: Build OpenWrt Images (${{ matrix.openwrt_version }})
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [openwrt, sdk]
        openwrt_version: [24.10.5, 25.12.3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        if: ${{ needs.metadata.outputs[format('changed_{0}', matrix.service)] == 'true' || needs.metadata.outputs.changed_makefile == 'true' || github.event.inputs.force_rebuild == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ./devenv/services/${{ matrix.service }}
          file: devenv/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.metadata.outputs.repo_owner }}/luci-sso-${{ matrix.service }}:${{ needs.metadata.outputs.sdk_arch }}-${{ matrix.openwrt_version }}
          build-args: |
            SDK_ARCH=${{ needs.metadata.outputs.sdk_arch }}
            SDK_VERSION=${{ matrix.openwrt_version }}
            PKG_DEPENDS=${{ needs.metadata.outputs.pkg_depends }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.openwrt_version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.openwrt_version }}

  build-helpers:
    name: Build Helper Images
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: idp
            tag_suffix: node${{ needs.metadata.outputs.node_version }}-alpine${{ needs.metadata.outputs.alpine_version }}
          - service: browser
            tag_suffix: node${{ needs.metadata.outputs.node_version }}-alpine${{ needs.metadata.outputs.alpine_version }}
          - service: pki
            tag_suffix: alpine${{ needs.metadata.outputs.alpine_version }}
          - service: fuzzer
            tag_suffix: alpine3.21
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        if: ${{ needs.metadata.outputs[format('changed_{0}', matrix.service)] == 'true' || needs.metadata.outputs.changed_makefile == 'true' || github.event.inputs.force_rebuild == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ./devenv/services/${{ matrix.service }}
          file: devenv/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.metadata.outputs.repo_owner }}/luci-sso-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ needs.metadata.outputs.repo_owner }}/luci-sso-${{ matrix.service }}:${{ matrix.tag_suffix }}
          build-args: |
            NODE_VERSION=${{ needs.metadata.outputs.node_version }}
            ALPINE_VERSION=${{ needs.metadata.outputs.alpine_version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  test:
    name: Verification (${{ matrix.crypto }} / ${{ matrix.openwrt_version }})
    runs-on: ubuntu-latest
    needs: [metadata, build-helpers, build-versioned]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        crypto: [mbedtls, wolfssl, openssl]
        openwrt_version: [24.10.5, 25.12.3]
    env:
      SDK_ARCH: ${{ needs.metadata.outputs.sdk_arch }}
      CRYPTO_LIB: ${{ matrix.crypto }}
      SDK_VERSION: ${{ matrix.openwrt_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pull images
        run: make -sC devenv pull

      - name: Compile
        run: make -sC devenv compile

      - name: Start environment
        run: make -sC devenv up

      - name: Unit Tests
        run: make -sC devenv unit-test VERBOSE=1

      - name: Fuzz Tests (60s)
        run: make -sC devenv fuzzer-test TIME=60

      - name: E2E Tests
        run: make -sC devenv e2e-test

      - name: Stop environment
        if: always()
        run: make -sC devenv down
