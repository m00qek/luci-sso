name: Continuous Integration

on:
  push:
    branches: [main, master, ci]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'STYLE_GUIDE.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, master, ci]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'STYLE_GUIDE.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild of all images"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  metadata:
    name: Extract Metadata
    runs-on: ubuntu-latest
    outputs:
      pkg_depends: ${{ steps.vars.outputs.pkg_depends }}
      sdk_version: ${{ steps.vars.outputs.sdk_version }}
      sdk_arch: ${{ steps.vars.outputs.sdk_arch }}
      targets: ${{ steps.vars.outputs.targets }}
      node_version: ${{ steps.vars.outputs.node_version }}
      alpine_version: ${{ steps.vars.outputs.alpine_version }}
      repo_owner: ${{ steps.vars.outputs.repo_owner }}
      changed_native: ${{ steps.filter.outputs.native }}
      changed_code: ${{ steps.filter.outputs.code }}
      changed_fuzzer: ${{ steps.filter.outputs.fuzzer }}
      changed_openwrt: ${{ steps.filter.outputs.openwrt }}
      changed_sdk: ${{ steps.filter.outputs.sdk }}
      changed_idp: ${{ steps.filter.outputs.idp }}
      changed_browser: ${{ steps.filter.outputs.browser }}
      changed_pki: ${{ steps.filter.outputs.pki }}
      changed_makefile: ${{ steps.filter.outputs.makefile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get Project Variables
        id: vars
        run: |
          # Use --no-print-directory and xargs to ensure perfectly clean strings
          DEPENDS=$(make -s --no-print-directory -C devenv print-env VAR=PKG_DEPENDS | xargs)
          VERSION=$(make -s --no-print-directory -C devenv print-env VAR=SDK_VERSION | xargs)
          NODE_V=$(make -s --no-print-directory -C devenv print-env VAR=NODE_VERSION | xargs)
          ALPINE_V=$(make -s --no-print-directory -C devenv print-env VAR=ALPINE_VERSION | xargs)
          ARCH="x86-64"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGETS='[{"sdk_arch":"x86-64","openwrt_version":"24.10.5"},{"sdk_arch":"x86-64","openwrt_version":"25.12.3"}]'
          else
            TARGETS='[{"sdk_arch":"x86-64","openwrt_version":"24.10.5"},{"sdk_arch":"x86-64","openwrt_version":"25.12.3"},{"sdk_arch":"aarch64_generic","openwrt_version":"25.12.3"},{"sdk_arch":"armsr-armv7","openwrt_version":"25.12.3"},{"sdk_arch":"mips_24kc","openwrt_version":"25.12.3"}]'
          fi

          echo "pkg_depends=$DEPENDS" >> $GITHUB_OUTPUT
          echo "sdk_version=$VERSION" >> $GITHUB_OUTPUT
          echo "sdk_arch=$ARCH" >> $GITHUB_OUTPUT
          echo "targets=$TARGETS" >> $GITHUB_OUTPUT
          echo "node_version=$NODE_V" >> $GITHUB_OUTPUT
          echo "alpine_version=$ALPINE_V" >> $GITHUB_OUTPUT

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_owner=$OWNER" >> $GITHUB_OUTPUT

      - name: Check for file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            native:
              - 'src/**'
              - 'test/fuzz_test.c'
              - 'devenv/services/fuzzer/**'
            code:
              - 'src/**'
              - 'files/**/*.uc'
              - 'test/**'
              - 'devenv/services/idp/**'
              - 'devenv/services/browser/**'
              - 'devenv/services/pki/**'
              - 'devenv/services/openwrt/**'
              - 'devenv/Makefile'
            fuzzer: 'devenv/services/fuzzer/**'
            openwrt: 'devenv/services/openwrt/**'
            sdk: 'devenv/services/sdk/**'
            idp: 'devenv/services/idp/**'
            browser: 'devenv/services/browser/**'
            pki: 'devenv/services/pki/**'
            makefile: 'devenv/Makefile'

  build-versioned:
    name: Build ${{ matrix.service }} (${{ matrix.target.sdk_arch }} / ${{ matrix.target.openwrt_version }})
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [openwrt, sdk]
        target: ${{ fromJson(needs.metadata.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: matrix.target.sdk_arch != 'x86-64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker platform
        run: echo "DOCKER_PLATFORM=$(devenv/scripts/resolve-arch.sh --platform ${{ matrix.target.sdk_arch }})" >> $GITHUB_ENV

      - name: Build and Push
        if: ${{ needs.metadata.outputs[format('changed_{0}', matrix.service)] == 'true' || needs.metadata.outputs.changed_makefile == 'true' || github.event.inputs.force_rebuild == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ./devenv/services/${{ matrix.service }}
          file: devenv/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.metadata.outputs.repo_owner }}/luci-sso-${{ matrix.service }}:${{ matrix.target.sdk_arch }}-${{ matrix.target.openwrt_version }}
          build-args: |
            SDK_ARCH=${{ matrix.target.sdk_arch }}
            SDK_VERSION=${{ matrix.target.openwrt_version }}
            PKG_DEPENDS=${{ needs.metadata.outputs.pkg_depends }}
            DOCKER_PLATFORM=${{ env.DOCKER_PLATFORM }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.target.sdk_arch }}-${{ matrix.target.openwrt_version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.target.sdk_arch }}-${{ matrix.target.openwrt_version }}

  build-helpers:
    name: Build ${{ matrix.service }}
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: idp
            tag_suffix: node${{ needs.metadata.outputs.node_version }}-alpine${{ needs.metadata.outputs.alpine_version }}
          - service: browser
            tag_suffix: node${{ needs.metadata.outputs.node_version }}-alpine${{ needs.metadata.outputs.alpine_version }}
          - service: pki
            tag_suffix: alpine${{ needs.metadata.outputs.alpine_version }}
          - service: fuzzer
            tag_suffix: alpine3.21
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        if: ${{ needs.metadata.outputs[format('changed_{0}', matrix.service)] == 'true' || needs.metadata.outputs.changed_makefile == 'true' || github.event.inputs.force_rebuild == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ./devenv/services/${{ matrix.service }}
          file: devenv/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.metadata.outputs.repo_owner }}/luci-sso-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ needs.metadata.outputs.repo_owner }}/luci-sso-${{ matrix.service }}:${{ matrix.tag_suffix }}
          build-args: |
            NODE_VERSION=${{ needs.metadata.outputs.node_version }}
            ALPINE_VERSION=${{ needs.metadata.outputs.alpine_version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  test-fuzz:
    name: Fuzz Tests (${{ matrix.crypto }})
    if: ${{ needs.metadata.outputs.changed_native == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: [metadata, build-helpers]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        crypto: [mbedtls, wolfssl, openssl]
    env:
      DOCKER_SUITE: ci
      SDK_ARCH: ${{ needs.metadata.outputs.sdk_arch }}
      CRYPTO_LIB: ${{ matrix.crypto }}
      SDK_VERSION: "25.12.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fuzz Tests (60s)
        run: make -sC devenv fuzz

  test-integration:
    name: Verification (${{ matrix.crypto }} / ${{ matrix.target.sdk_arch }} / ${{ matrix.target.openwrt_version }})
    if: ${{ needs.metadata.outputs.changed_code == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: [metadata, build-helpers, build-versioned]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        crypto: [mbedtls, wolfssl, openssl]
        target: ${{ fromJson(needs.metadata.outputs.targets) }}
    env:
      DOCKER_SUITE: ci
      SDK_ARCH: ${{ matrix.target.sdk_arch }}
      CRYPTO_LIB: ${{ matrix.crypto }}
      SDK_VERSION: ${{ matrix.target.openwrt_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: matrix.target.sdk_arch != 'x86-64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Pull images
        run: make -sC devenv pull

      - name: Compile
        run: make -sC devenv compile

      - name: Start infrastructure
        run: make -sC devenv infra-up

      - name: Unit Tests
        run: make -sC devenv test

      - name: E2E Tests
        if: matrix.target.sdk_arch == 'x86-64'
        run: make -sC devenv e2e

      - name: Stop infrastructure
        if: always()
        run: make -sC devenv infra-down
