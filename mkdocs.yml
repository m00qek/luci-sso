site_name: LuCI SSO
site_description: Secure, Lightweight OIDC/OAuth2 Login for OpenWrt LuCI.
site_url: https://m00qek.github.io/luci-sso/
site_dir: bin/site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Welcome: index.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Building from Source: tutorials/building.md
      - Developer Onboarding: tutorials/dev-onboarding.md
  - How-to Guides:
      - Overview: how-to/index.md
      - Providers:
          - Google: how-to/providers/google.md
          - Github: how-to/providers/github.md
          - Authelia: how-to/providers/authelia.md
      - Sysadmin:
          - Installation: how-to/sysadmin/installation.md
          - Debugging & Logs: how-to/sysadmin/debugging.md
      - Developer:
          - Running Tests: how-to/developer/testing.md
          - Fuzz Testing: how-to/developer/fuzzing.md
          - Writing Documentation: how-to/developer/documentation.md
  - Reference:
      - Overview: reference/index.md
      - UCI Configuration: reference/uci-config.md
      - Internal API: reference/internal-api.md
      - Style Guide: reference/style-guide.md
      - RFC Compliance: reference/rfc-compliance.md
      - Agent Context (AI): reference/agent-context.md
  - Explanation:
      - Overview: explanation/index.md
      - About LuCI SSO: explanation/about.md
      - Security Model: explanation/security-model.md
      - Architecture: explanation/architecture.md
      - Threat Model: explanation/threat-model.md
