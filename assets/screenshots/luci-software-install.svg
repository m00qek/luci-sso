<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <rect width="900" height="480" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>

  <!-- Browser chrome -->
  <rect width="900" height="40" fill="#e0e0e0"/>
  <rect x="10" y="10" width="20" height="20" rx="10" fill="#bbb"/>
  <rect x="40" y="10" width="20" height="20" rx="10" fill="#bbb"/>
  <rect x="70" y="10" width="20" height="20" rx="10" fill="#bbb"/>
  <rect x="100" y="8" width="700" height="24" rx="12" fill="#fff" stroke="#ccc"/>
  <text x="450" y="24" font-family="monospace" font-size="12" fill="#666" text-anchor="middle">https://192.168.1.1/cgi-bin/luci/admin/system/software</text>

  <!-- LuCI header -->
  <rect y="40" width="900" height="50" fill="#1a237e"/>
  <text x="20" y="72" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">OpenWrt - Software</text>

  <!-- Content area -->
  <rect x="20" y="110" width="860" height="340" rx="4" fill="white" stroke="#ddd"/>
  
  <!-- Buttons -->
  <rect x="40" y="130" width="120" height="32" rx="4" fill="#4caf50"/>
  <text x="100" y="151" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle">Update lists...</text>

  <rect x="170" y="130" width="140" height="32" rx="4" fill="#2196f3"/>
  <text x="240" y="151" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle">Upload Package...</text>

  <!-- Filter box -->
  <text x="600" y="151" font-family="sans-serif" font-size="12" fill="#666">Filter:</text>
  <rect x="640" y="130" width="220" height="32" rx="4" fill="#f9f9f9" stroke="#ccc"/>

  <!-- Table placeholder -->
  <rect x="40" y="180" width="820" height="240" fill="#f5f5f5" stroke="#eee"/>
  <line x1="40" y1="210" x2="860" y2="210" stroke="#ddd"/>
  <text x="450" y="300" font-family="sans-serif" font-size="14" fill="#999" text-anchor="middle">Package List</text>

  <!-- Placeholder banner -->
  <rect x="0" y="430" width="900" height="50" fill="rgba(0,0,0,0.5)"/>
  <text x="450" y="460" font-family="sans-serif" font-size="13" fill="#fff8e1" text-anchor="middle">[ PLACEHOLDER — Replace with actual screenshot of LuCI System > Software page ]</text>
</svg>
