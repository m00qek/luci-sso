<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>

  <!-- Browser chrome -->
  <rect width="900" height="40" fill="#e0e0e0"/>
  <rect x="10" y="10" width="20" height="20" rx="10" fill="#bbb"/>
  <rect x="40" y="10" width="20" height="20" rx="10" fill="#bbb"/>
  <rect x="70" y="10" width="20" height="20" rx="10" fill="#bbb"/>
  <rect x="100" y="8" width="700" height="24" rx="12" fill="#fff" stroke="#ccc"/>
  <text x="450" y="24" font-family="monospace" font-size="12" fill="#666" text-anchor="middle">https://192.168.1.1/cgi-bin/luci/admin/services/sso</text>

  <!-- LuCI header bar -->
  <rect y="40" width="900" height="48" fill="#1a237e"/>
  <text x="20" y="70" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">OpenWrt — LuCI</text>
  <text x="720" y="70" font-family="sans-serif" font-size="13" fill="#90caf9">Services ▸ SSO Login</text>

  <!-- Sidebar -->
  <rect x="0" y="88" width="180" height="432" fill="#283593"/>
  <rect x="0" y="88" width="180" height="36" fill="#3949ab"/>
  <text x="16" y="112" font-family="sans-serif" font-size="13" fill="white">Services</text>
  <rect x="0" y="124" width="180" height="36" fill="#1a237e"/>
  <text x="28" y="148" font-family="sans-serif" font-size="13" fill="#90caf9">▶  SSO Login</text>

  <!-- Main content area -->
  <rect x="196" y="100" width="688" height="400" fill="white" stroke="#e0e0e0"/>

  <!-- Page title -->
  <text x="216" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a237e">SSO Login Configuration</text>
  <line x1="216" y1="138" x2="868" y2="138" stroke="#e0e0e0"/>

  <!-- Form fields -->
  <text x="216" y="170" font-family="sans-serif" font-size="13" fill="#333">Enable SSO</text>
  <rect x="440" y="155" width="20" height="20" rx="3" fill="#1a237e"/>
  <text x="465" y="170" font-family="sans-serif" font-size="12" fill="#555">✓ Enabled</text>

  <text x="216" y="215" font-family="sans-serif" font-size="13" fill="#333">Issuer URL</text>
  <rect x="440" y="200" width="400" height="28" rx="3" fill="white" stroke="#bbb"/>
  <text x="448" y="219" font-family="monospace" font-size="12" fill="#666">https://&lt;your-idp&gt;/.well-known/openid-configuration</text>

  <text x="216" y="260" font-family="sans-serif" font-size="13" fill="#333">Client ID</text>
  <rect x="440" y="245" width="400" height="28" rx="3" fill="white" stroke="#bbb"/>
  <text x="448" y="264" font-family="monospace" font-size="12" fill="#aaa">your-client-id</text>

  <text x="216" y="305" font-family="sans-serif" font-size="13" fill="#333">Client Secret</text>
  <rect x="440" y="290" width="400" height="28" rx="3" fill="white" stroke="#bbb"/>
  <text x="448" y="309" font-family="monospace" font-size="12" fill="#aaa">••••••••••••••••</text>

  <text x="216" y="350" font-family="sans-serif" font-size="13" fill="#333">Redirect URI</text>
  <rect x="440" y="335" width="400" height="28" rx="3" fill="#f9f9f9" stroke="#bbb"/>
  <text x="448" y="354" font-family="monospace" font-size="12" fill="#888">https://192.168.1.1/cgi-bin/luci-sso/callback</text>

  <!-- Save button -->
  <rect x="720" y="430" width="140" height="36" rx="4" fill="#1a237e"/>
  <text x="790" y="453" font-family="sans-serif" font-size="14" fill="white" text-anchor="middle">Save &amp; Apply</text>

  <!-- Placeholder banner -->
  <rect x="196" y="455" width="688" height="44" fill="#fff8e1"/>
  <text x="450" y="482" font-family="sans-serif" font-size="13" fill="#f57f17" text-anchor="middle">[ PLACEHOLDER — Replace with actual screenshot of LuCI Services › SSO Login page ]</text>
</svg>
